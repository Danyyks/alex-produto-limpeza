<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="kGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b794f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9f7aea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#805ad5;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- K Symbol - Left vertical bar -->
  <polygon points="180,120 220,140 220,280 180,300" fill="url(#kGradient)" />

  <!-- K Symbol - Top diagonal -->
  <polygon points="220,140 380,120 380,180 260,200" fill="url(#kGradient)" />

  <!-- K Symbol - Bottom diagonal -->
  <polygon points="260,220 380,240 380,300 220,280" fill="url(#kGradient)" />

  <!-- Khode text -->
  <text x="410" y="260" font-family="Arial, sans-serif" font-size="120" font-weight="700" fill="white" letter-spacing="0">Khode</text>

  <!-- SYSTEMS text -->
  <text x="410" y="310" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#b794f6" letter-spacing="12">SYSTEMS</text>
</svg>
